name: Refresh activity

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the contribution graph
        run: python3 scripts/activity.py
      - name: Commit when the numbers changed
        run: |
          git config user.name "MachineX41"
          git config user.email "yusufalcicek41@gmail.com"
          git add activity.svg
          git diff --cached --quiet && exit 0
          git commit -m "Refresh contribution graph"
          git push
